<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BurgerBlaze</title>

<style>
/* ================= GLOBAL ================= */
:root{
  --red:#d62828;
  --yellow:#fcbf49;
  --white:#ffffff;
  --dark:#1e1e1e;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Helvetica,sans-serif;}
body{background:#fff;color:#222;transition:.3s;}
body.dark{background:#111;color:#fff;}
a{text-decoration:none;color:inherit}
button{cursor:pointer;border:none}

/* ================= LOADER ================= */
#loader{
position:fixed;inset:0;background:var(--red);
display:flex;align-items:center;justify-content:center;
color:#fff;font-size:30px;z-index:9999;
}

/* ================= NAVBAR ================= */
header{
position:sticky;top:0;z-index:1000;
backdrop-filter:blur(10px);
background:rgba(255,255,255,0.85);
display:flex;justify-content:space-between;
padding:15px 40px;align-items:center;
}
body.dark header{background:rgba(0,0,0,0.7);}
.logo{font-size:24px;font-weight:bold;color:var(--red);}
nav a{margin:0 15px;transition:.3s;}
nav a:hover{color:var(--red);}
.nav-right button{margin-left:10px;padding:6px 12px;border-radius:20px;background:var(--yellow);transition:.3s;}
.nav-right button:hover{transform:scale(1.1);}

/* ================= HERO ================= */
.hero{
height:80vh;
background:url("https://source.unsplash.com/1600x900/?burger,fastfood") center/cover;
display:flex;flex-direction:column;align-items:center;justify-content:center;
color:white;text-align:center;
}
.hero h1{font-size:50px;margin-bottom:20px;}
.hero button{
padding:15px 30px;border-radius:30px;background:var(--yellow);
transition:.3s;
}
.hero button:hover{transform:scale(1.1);}

/* ================= MENU ================= */
.section{padding:60px 40px;text-align:center;}
.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;margin-top:40px;
}
.card{
background:#fff;border-radius:15px;
overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,.1);
transition:.35s;
}
body.dark .card{background:#222;}
.card:hover{transform:scale(1.05);box-shadow:0 15px 30px rgba(0,0,0,.3);}
.card img{width:100%;height:160px;object-fit:cover;}
.card-content{padding:15px;}
.card button{
margin-top:10px;background:var(--red);
color:white;padding:8px 15px;border-radius:20px;
transition:.3s;
}
.card button:hover{background:#000;}

/* ================= CART ================= */
.cart{
position:fixed;right:-400px;top:0;width:350px;height:100%;
background:#fff;box-shadow:-5px 0 20px rgba(0,0,0,.3);
padding:20px;transition:.4s;overflow-y:auto;z-index:2000;
}
body.dark .cart{background:#222;}
.cart.active{right:0;}
.cart-item{display:flex;justify-content:space-between;margin-bottom:10px;}
.qty-btn{padding:3px 8px;background:var(--yellow);border-radius:5px;margin:0 5px;}
.total{font-weight:bold;margin-top:15px;}
.checkout-btn{margin-top:10px;background:var(--red);color:white;padding:10px;border-radius:10px;width:100%;}

/* ================= MODAL ================= */
.modal{
position:fixed;inset:0;background:rgba(0,0,0,.6);
display:none;align-items:center;justify-content:center;
z-index:3000;
}
.modal-content{
background:#fff;padding:30px;border-radius:15px;width:300px;
}
body.dark .modal-content{background:#222;}
.modal input{width:100%;padding:8px;margin:8px 0;}
.modal button{width:100%;padding:8px;background:var(--red);color:white;border-radius:10px;}

/* ================= REVIEWS ================= */
.review-card{
background:#fff;padding:15px;border-radius:10px;
margin:10px 0;box-shadow:0 5px 10px rgba(0,0,0,.1);
transition:.3s;
}
.review-card:hover{transform:translateY(-5px);}
body.dark .review-card{background:#222;}

/* ================= TOAST ================= */
.toast{
position:fixed;bottom:20px;right:20px;
background:var(--red);color:#fff;
padding:10px 20px;border-radius:20px;
opacity:0;transition:.4s;
}
.toast.show{opacity:1;}

@media(max-width:600px){
.hero h1{font-size:32px;}
header{flex-direction:column;}
}
</style>
</head>

<body>

<div id="loader">BurgerBlaze</div>

<header>
<div class="logo">🍔 BurgerBlaze</div>
<nav>
<a href="#">Home</a>
<a href="#menu">Menu</a>
<a href="#reviews">Reviews</a>
</nav>
<div class="nav-right">
<span id="welcome"></span>
<button onclick="toggleDark()">🌙</button>
<button onclick="openAuth()">Login</button>
<button onclick="toggleCart()">🛒 (<span id="cartCount">0</span>)</button>
</div>
</header>

<section class="hero">
<h1>Flame Grilled Happiness</h1>
<button onclick="document.getElementById('menu').scrollIntoView()">Order Now</button>
</section>

<section class="section" id="menu">
<h2>Our Menu</h2>
<input type="text" placeholder="Search..." onkeyup="searchMenu(this.value)">
<div class="menu-grid" id="menuGrid"></div>
</section>

<section class="section" id="reviews">
<h2>Customer Reviews</h2>
<div id="reviewList"></div>
<input type="text" id="reviewInput" placeholder="Write review">
<button onclick="addReview()">Add Review</button>
</section>

<div class="cart" id="cart"></div>

<div class="modal" id="authModal">
<div class="modal-content">
<h3>Login / Signup</h3>
<input type="text" id="username" placeholder="Username">
<input type="password" id="password" placeholder="Password">
<button onclick="auth()">Submit</button>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================= DATA ================= */
const foods=[
{name:"Classic Burger",price:199,img:"https://source.unsplash.com/400x300/?burger"},
{name:"Cheese Burger",price:249,img:"https://source.unsplash.com/400x300/?cheeseburger"},
{name:"Fries",price:99,img:"https://source.unsplash.com/400x300/?fries"},
{name:"Chicken Wrap",price:179,img:"https://source.unsplash.com/400x300/?wrap"},
{name:"Nuggets",price:149,img:"https://source.unsplash.com/400x300/?nuggets"},
{name:"Pizza Slice",price:129,img:"https://source.unsplash.com/400x300/?pizza"},
{name:"Milkshake",price:159,img:"https://source.unsplash.com/400x300/?milkshake"},
{name:"Hot Dog",price:139,img:"https://source.unsplash.com/400x300/?hotdog"}
];

let cart=JSON.parse(localStorage.getItem("cart"))||[];
let user=JSON.parse(localStorage.getItem("user"));

/* ================= INIT ================= */
window.onload=()=>{
setTimeout(()=>document.getElementById("loader").style.display="none",1000);
renderMenu(foods);
updateCart();
loadReviews();
if(user) showUser();
}

/* ================= MENU ================= */
function renderMenu(list){
let grid=document.getElementById("menuGrid");
grid.innerHTML="";
list.forEach((item,i)=>{
grid.innerHTML+=`
<div class="card">
<img src="${item.img}">
<div class="card-content">
<h4>${item.name}</h4>
<p>₹${item.price}</p>
<p>⭐⭐⭐⭐☆</p>
<button onclick="addToCart(${i})">Add to Cart</button>
</div>
</div>`;
});
}

function searchMenu(val){
val=val.toLowerCase();
renderMenu(foods.filter(f=>f.name.toLowerCase().includes(val)));
}

/* ================= CART ================= */
function addToCart(i){
let item=foods[i];
let found=cart.find(c=>c.name===item.name);
if(found){found.qty++;}
else{cart.push({...item,qty:1});}
localStorage.setItem("cart",JSON.stringify(cart));
updateCart();
toast("Added to cart");
}

function updateCart(){
let cartDiv=document.getElementById("cart");
cartDiv.innerHTML="<h2>Your Cart</h2>";
let total=0;
cart.forEach((item,i)=>{
total+=item.price*item.qty;
cartDiv.innerHTML+=`
<div class="cart-item">
${item.name} x${item.qty}
<div>
<button class="qty-btn" onclick="changeQty(${i},1)">+</button>
<button class="qty-btn" onclick="changeQty(${i},-1)">-</button>
</div>
</div>`;
});
cartDiv.innerHTML+=`<div class="total">Total: ₹${total}</div>
<button class="checkout-btn" onclick="checkout()">Checkout</button>`;
document.getElementById("cartCount").innerText=cart.length;
}

function changeQty(i,delta){
cart[i].qty+=delta;
if(cart[i].qty<=0) cart.splice(i,1);
localStorage.setItem("cart",JSON.stringify(cart));
updateCart();
}

function toggleCart(){
document.getElementById("cart").classList.toggle("active");
}

function checkout(){
if(!user){toast("Login required");return;}
toast("Payment Successful!");
cart=[];
localStorage.removeItem("cart");
updateCart();
toggleCart();
}

/* ================= AUTH ================= */
function openAuth(){document.getElementById("authModal").style.display="flex";}
function auth(){
let name=document.getElementById("username").value;
let pass=document.getElementById("password").value;
if(!name||!pass){toast("Fill all fields");return;}
user={name};
localStorage.setItem("user",JSON.stringify(user));
showUser();
document.getElementById("authModal").style.display="none";
toast("Login Successful");
}
function showUser(){
document.getElementById("welcome").innerText="Welcome, "+user.name;
}

/* ================= REVIEWS ================= */
function loadReviews(){
let reviews=JSON.parse(localStorage.getItem("reviews"))||["Amazing food!","Loved the burger!"];
let list=document.getElementById("reviewList");
list.innerHTML="";
reviews.forEach(r=>{
list.innerHTML+=`<div class="review-card">${r}</div>`;
});
}
function addReview(){
let input=document.getElementById("reviewInput");
let reviews=JSON.parse(localStorage.getItem("reviews"))||[];
reviews.push(input.value);
localStorage.setItem("reviews",JSON.stringify(reviews));
input.value="";
loadReviews();
toast("Review Added");
}

/* ================= DARK MODE ================= */
function toggleDark(){document.body.classList.toggle("dark");}

/* ================= TOAST ================= */
function toast(msg){
let t=document.getElementById("toast");
t.innerText=msg;
t.classList.add("show");
setTimeout(()=>t.classList.remove("show"),2000);
}
</script>

</body>
</html>
